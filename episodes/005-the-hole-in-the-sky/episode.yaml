notes:
  - The "NASA software threw the data away" story is a myth. Low readings were flagged, not deleted, and a faulty South Pole ground reading made NASA doubt its satellite. The script tells the true version.
  - The chlorine "smoking gun" flight and the Montreal Protocol signing were on the same day, 16 September 1987.
  - Light, hopeful ending. Good for ads, and a good counterweight after a heavy episode.

